<div class="page">
  <div class="panel">
    <div class="header">
      <h2>Ajouter Skills Proof</h2>
      <button class="btn ghost" (click)="back()">Retour</button>
    </div>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="row" *ngIf="selectedSkillId; else manualSkillId">
        <label>Skill liee</label>
        <input [value]="'Skill #' + selectedSkillId + (selectedSkillName ? ' - ' + selectedSkillName : '')" disabled />
      </div>

      <ng-template #manualSkillId>
        <div class="row">
          <label>Skill ID</label>
          <input type="number" min="1" formControlName="skillId" placeholder="ex: 15" />
          <small *ngIf="form.get('skillId')?.touched && form.get('skillId')?.invalid">
            Skill ID obligatoire.
          </small>
        </div>
      </ng-template>

      <div class="row">
        <label>Titre</label>
        <input formControlName="title" placeholder="ex: Oracle Certificate" />
      </div>

      <div class="row">
        <label>Type</label>
        <select formControlName="type">
          <option *ngFor="let t of proofTypes" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="row">
        <label>URL du fichier</label>
        <input formControlName="fileUrl" placeholder="https://..." />
      </div>

      <div class="actions">
        <button class="btn primary" type="submit" [disabled]="saving || form.invalid">
          {{ saving ? 'Enregistrement...' : 'Creer Proof' }}
        </button>
      </div>
    </form>
  </div>
</div>
